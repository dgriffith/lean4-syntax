[package]
name = "lean4-syntax"
version = "0.1.0"
edition = "2024"
description = "A lossless parser and syntax tree for Lean 4 source files"
license = "MIT OR Apache-2.0"
keywords = ["lean", "lean4", "parser", "syntax-tree", "theorem-prover"]
categories = ["parser-implementations", "development-tools"]
readme = "README.md"
repository = "https://github.com/dgriffith/lean4-syntax"

[dependencies]
chumsky = { version = "0.13.0", features = ["pratt"] }
rowan = "0.17.0"
stacker = "0.1.25"

[dev-dependencies]
expect-test = "1.5.1"
